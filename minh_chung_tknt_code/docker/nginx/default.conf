map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
    }

    location /assets/inventory_models/ {
        alias /usr/share/nginx/static-assets/inventory_models/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /assets/inventory_model_candidates/ {
        alias /usr/share/nginx/static-assets/inventory_model_candidates/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /assets/three/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Compatibility for previously built Vite chunks that import vendored Three.js by relative paths.
    location = /assets/three.module.js {
        try_files /assets/three/three.module.js =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /three.module.js {
        try_files /assets/three/three.module.js =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /utils/ {
        alias /usr/share/nginx/html/assets/three/utils/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /libs/ {
        alias /usr/share/nginx/html/assets/three/libs/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
