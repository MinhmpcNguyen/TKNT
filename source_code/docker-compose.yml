services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tknt}
      POSTGRES_USER: ${POSTGRES_USER:-tknt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tknt_password}
    volumes:
      - tknt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tknt}
      POSTGRES_USER: ${POSTGRES_USER:-tknt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tknt_password}
      PG_ADMIN_USER: ${PG_ADMIN_USER:-}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD:-}
      PG_ADMIN_DB: ${PG_ADMIN_DB:-}
      PG_ADMIN_HOST: ${PG_ADMIN_HOST:-}
      PG_ADMIN_PORT: ${PG_ADMIN_PORT:-}
      VECTOR_DIMS: ${VECTOR_DIMS:-1536}
      BATCH_SIZE: ${BATCH_SIZE:-64}
      AUTO_EMBED_ON_LOAD: ${AUTO_EMBED_ON_LOAD:-0}
      TKNT_API_KEY: ${TKNT_API_KEY:-change-me}
      TKNT_SHARED_INVENTORY_TENANT_ID: ${TKNT_SHARED_INVENTORY_TENANT_ID:-demo_tenant}
      TKNT_ADMIN_EMAILS: ${TKNT_ADMIN_EMAILS:-}
      TKNT_ADMIN_GLB_UPLOAD_MAX_BYTES: ${TKNT_ADMIN_GLB_UPLOAD_MAX_BYTES:-67108864}
      TKNT_AUTH_SESSION_TTL_DAYS: ${TKNT_AUTH_SESSION_TTL_DAYS:-30}
      TKNT_AUTH_PBKDF2_ITERATIONS: ${TKNT_AUTH_PBKDF2_ITERATIONS:-240000}
      TKNT_LOG_LEVEL: ${TKNT_LOG_LEVEL:-INFO}
      LOG_LEVEL: ${TKNT_LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_ALL_FILENAME: ${LOG_ALL_FILENAME:-}
      FIX_HISTORY_MAX_ENTRIES: ${FIX_HISTORY_MAX_ENTRIES:-200}
      FIX_HISTORY_MAX_ISSUES: ${FIX_HISTORY_MAX_ISSUES:-50}
      FIX_HISTORY_MAX_CHANGES: ${FIX_HISTORY_MAX_CHANGES:-200}
      UI_SNAPSHOT_DIR: ${UI_SNAPSHOT_DIR:-logs/ui_snapshots}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-2024-08-01-preview}
      OPENAI_PRIMARY_MODEL: ${OPENAI_PRIMARY_MODEL:-gpt-5.4-mini}
      OPENAI_HELPER_MODEL: ${OPENAI_HELPER_MODEL:-gpt-5.4-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_IMAGE_API_KEY: ${OPENAI_IMAGE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SOFT_RULE_SIM_THRESHOLD: ${SOFT_RULE_SIM_THRESHOLD:-0.72}
      SOFT_RULE_LLM_CHECK: ${SOFT_RULE_LLM_CHECK:-0}
      CRAWL4AI_ENABLED: ${CRAWL4AI_ENABLED:-0}
      USE_VERIFIER_FLOW: ${USE_VERIFIER_FLOW:-0}
      SELF_IMPROVEMENT_MAX_ATTEMPTS: ${SELF_IMPROVEMENT_MAX_ATTEMPTS:-0}
      TKNT_ABLATION_MODE: ${TKNT_ABLATION_MODE:-full}
      TKNT_PROMPT_COMPILER_INCLUDE_MINOR_DECOR: ${TKNT_PROMPT_COMPILER_INCLUDE_MINOR_DECOR:-0}
      TKNT_REQUEST_CONTRACT_LLM: ${TKNT_REQUEST_CONTRACT_LLM:-1}
      TKNT_SEMANTIC_ADAPTIVE_LLM: ${TKNT_SEMANTIC_ADAPTIVE_LLM:-0}
      TKNT_STYLE_POLICY_REQUIRE_LLM: ${TKNT_STYLE_POLICY_REQUIRE_LLM:-0}
      TKNT_TIER_COUNT_USE_SIZE_RULES: ${TKNT_TIER_COUNT_USE_SIZE_RULES:-1}
      TKNT_IMAGE_PROVIDER: ${TKNT_IMAGE_PROVIDER:-openai}
      TKNT_SNAPSHOT_RENDER_REWRITE_MODEL: ${TKNT_SNAPSHOT_RENDER_REWRITE_MODEL:-}
      TKNT_SNAPSHOT_RENDER_IMAGE_MODEL: ${TKNT_SNAPSHOT_RENDER_IMAGE_MODEL:-}
      TKNT_SNAPSHOT_RENDER_IMAGE_SIZE: ${TKNT_SNAPSHOT_RENDER_IMAGE_SIZE:-}
      TKNT_SNAPSHOT_RENDER_MAX_TOKENS: ${TKNT_SNAPSHOT_RENDER_MAX_TOKENS:-256}
      TKNT_OPENAI_IMAGE_MODEL: ${TKNT_OPENAI_IMAGE_MODEL:-gpt-image-2}
      TKNT_OPENAI_IMAGE_SIZE: ${TKNT_OPENAI_IMAGE_SIZE:-1536x1024}
      TKNT_OPENAI_IMAGE_QUALITY: ${TKNT_OPENAI_IMAGE_QUALITY:-medium}
      TKNT_OPENAI_IMAGE_STREAM_PARTIAL_IMAGES: ${TKNT_OPENAI_IMAGE_STREAM_PARTIAL_IMAGES:-2}
      TKNT_SNAPSHOT_RENDER_INCLUDE_ANNOTATED_REFERENCE: ${TKNT_SNAPSHOT_RENDER_INCLUDE_ANNOTATED_REFERENCE:-false}
      TKNT_SNAPSHOT_RENDER_INCLUDE_GEOMETRY_REFERENCES: ${TKNT_SNAPSHOT_RENDER_INCLUDE_GEOMETRY_REFERENCES:-false}
      TKNT_SNAPSHOT_RENDER_INCLUDE_LOCKED_GEOMETRY_REFERENCES: ${TKNT_SNAPSHOT_RENDER_INCLUDE_LOCKED_GEOMETRY_REFERENCES:-false}
      TKNT_SNAPSHOT_RENDER_INCLUDE_PRESET_REFERENCE_IMAGES: ${TKNT_SNAPSHOT_RENDER_INCLUDE_PRESET_REFERENCE_IMAGES:-true}
      TKNT_SNAPSHOT_RENDER_SIMPLE_PROMPT: ${TKNT_SNAPSHOT_RENDER_SIMPLE_PROMPT:-false}
      TKNT_SNAPSHOT_RENDER_TEXT_CONTRACT: ${TKNT_SNAPSHOT_RENDER_TEXT_CONTRACT:-false}
      TKNT_SNAPSHOT_RENDER_TEXT_CONTRACT_OBJECT_LIMIT: ${TKNT_SNAPSHOT_RENDER_TEXT_CONTRACT_OBJECT_LIMIT:-10}
      TKNT_SNAPSHOT_RENDER_STRICT_LAYOUT: ${TKNT_SNAPSHOT_RENDER_STRICT_LAYOUT:-true}
      TKNT_IMAGE_FLOW_EVAL_MODEL: ${TKNT_IMAGE_FLOW_EVAL_MODEL:-}
      TKNT_IMAGE_FLOW_PREFLIGHT_MODEL: ${TKNT_IMAGE_FLOW_PREFLIGHT_MODEL:-gpt-5.4-mini}
      TKNT_IMAGE_FLOW_PREFLIGHT_OPENAI_BASE_URL: ${TKNT_IMAGE_FLOW_PREFLIGHT_OPENAI_BASE_URL:-}
      TKNT_VISUAL_RELATION_PLANNER: ${TKNT_VISUAL_RELATION_PLANNER:-}
      TKNT_VISUAL_RELATION_SOLVER: ${TKNT_VISUAL_RELATION_SOLVER:-}
      TKNT_VISUAL_RELATION_MODEL: ${TKNT_VISUAL_RELATION_MODEL:-}
      VITE_TKNT_VISUAL_RELATION_PLANNER_MODE: ${VITE_TKNT_VISUAL_RELATION_PLANNER_MODE:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-google}
      SEARCH_FALLBACK: ${SEARCH_FALLBACK:-duckduckgo}
      SEARCH_CACHE_TTL_SEC: ${SEARCH_CACHE_TTL_SEC:-86400}
      SEARCH_CACHE_MAX: ${SEARCH_CACHE_MAX:-200}
      SEARCH_CACHE_PATH: ${SEARCH_CACHE_PATH:-logs/search_cache.json}
      SEARCH_CONTENT_CACHE_PATH: ${SEARCH_CONTENT_CACHE_PATH:-logs/search_content_cache.json}
      SEARCH_CONTENT_CACHE_MAX: ${SEARCH_CONTENT_CACHE_MAX:-400}
    volumes:
      - tknt-cases:/app/cases
      - tknt-generated:/app/generated
      - tknt-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      target: web
    ports:
      - "${TKNT_WEB_PORT:-8080}:80"
    volumes:
      - ${TKNT_STATIC_ASSETS_ROOT:-./frontend/public/assets}:/usr/share/nginx/static-assets:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tknt-postgres-data:
  tknt-cases:
  tknt-generated:
  tknt-logs:
